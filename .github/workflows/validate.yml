name: Validate starter kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  distribution:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: actions/setup-node@v5
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Check generated files and documentation links
        run: python3 scripts/package.py --check
