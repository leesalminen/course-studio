name: Publish landing page

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7.0.1
      - name: Validate starter kit
        run: python3 scripts/package.py --check
      - uses: actions/configure-pages@v5
      - name: Prepare public site
        run: |
          mkdir -p _site/downloads
          cp -R website/. _site/
          cp output/pdf/Pocket-Lab-Learner.pdf output/pdf/Pocket-Lab-Parent-Teacher-Guide.pdf _site/downloads/
          cp chatgpt/START-COURSE-STUDIO.md Course-Studio-Starter-Kit.zip _site/downloads/
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
